<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    src: url("../static/fonts/Geist-Variable.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("../static/fonts/GeistMono-Variable.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background-color: #f3eee2;
    background-image:
      linear-gradient(to right, #dfd6c2 1px, transparent 1px),
      linear-gradient(to bottom, #dfd6c2 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: "Geist", sans-serif;
    color: #1c1b18;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px;
  }
  .panel {
    width: 100%;
    height: 100%;
    background: #fffdf6;
    border: 4px solid #22211d;
    border-radius: 26px;
    box-shadow: 10px 10px 0 #22211d;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 30px;
    background: #ebe3d2;
    border-bottom: 4px solid #22211d;
    font-family: "Geist Mono", monospace;
    font-size: 24px;
    letter-spacing: 0.06em;
    color: #635f52;
  }
  .dot { width: 16px; height: 16px; border-radius: 999px; border: 3px solid #22211d; }
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 56px; }
  .mark {
    display: flex; align-items: center; gap: 14px;
    font-family: "Geist Mono", monospace; font-size: 30px; font-weight: 600;
  }
  .lh {
    width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
    background: #6a4bd4; color: #fffdf6; border: 3px solid #22211d; border-radius: 12px;
    font-size: 22px; font-weight: 700;
  }
  .sub { color: #635f52; font-weight: 500; }
  h1 { margin-top: 30px; font-size: 62px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.1; }
  p { margin-top: 20px; font-size: 30px; color: #635f52; max-width: 24ch; line-height: 1.4; }
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 30px; border-top: 4px solid #22211d; background: #ebe3d2;
    font-family: "Geist Mono", monospace; font-size: 24px; color: #635f52;
  }
  .foot b { color: #1c1b18; font-weight: 600; }
</style>
</head>
<body>
  <div class="panel">
    <div class="titlebar">
      <span class="dot" style="background:#e5765b"></span>
      <span class="dot" style="background:#e8b02f"></span>
      <span class="dot" style="background:#5fbb91"></span>
      <span style="margin-left:10px">~/notes</span>
    </div>
    <div class="body">
      <div class="mark">
        <span class="lh">LH</span>
        <span>lazare.exe <span class="sub">/ blog</span></span>
      </div>
      <h1>Working notes</h1>
      <p>Notes on software, systems, and the craft of building.</p>
    </div>
    <div class="foot">
      <b>blog.herzi.ai</b>
      <span>lazare herzi</span>
    </div>
  </div>
</body>
</html>
