name: Deploy Hugo Site to AWS

# This tells GitHub to run the pipeline every time you push to the 'main' branch
on:
  push:
    branches:
      - main  

  # CRITICAL: This permissions block is required for OIDC
permissions:
  id-token: write   # Allows GitHub to request the OIDC JWT token
  contents: read    # Allows GitHub to read your repository code

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Grab your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true  # CRITICAL: This ensures your Hugo theme is downloaded
          fetch-depth: 0    

      # 2. Install Hugo on the GitHub server
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.163.0'
          extended: true

      # 3. Build the static HTML files
      - name: Build Hugo Site
        run: hugo --minify

      # UPDATED: Assume the IAM Role using OIDC instead of Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::304119515519:role/GitHubActions-HugoDeployRole
          aws-region: us-east-1

      # 5. Upload the files to your S3 bucket
      - name: Deploy to S3
        run: aws s3 sync public/ s3://lazares-hugo-blog-bucket-2026 --delete

      # 6. Clear the CloudFront cache so the new post shows up instantly
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E4EUP3S7895OL --paths "/*"